<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName photo.partitions.ovh

        DocumentRoot /var/www/photo/public

        <Directory /var/www/photo/public>
            Options -Indexes
            AllowOverride None
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/photo.partitions.ovh-error.log
        CustomLog ${APACHE_LOG_DIR}/photo.partitions.ovh-access.log combined

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/photo.partitions.ovh/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/photo.partitions.ovh/privkey.pem
        Include /etc/letsencrypt/options-ssl-apache.conf
    </VirtualHost>
</IfModule>
